# ==========================================
# CONEXIÓN DINÁMICA (POSTGRESQL / NEON)
# ==========================================

# 1. URL de la Base de Datos
# Si no hay variable de entorno, fallará (lo cual es bueno para seguridad)
spring.datasource.url=${DB_URL}

# 2. Usuario y Contraseña
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}

# 3. Configuraciones Técnicas
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# 4. Gestión de Tablas (Mantenemos 'update' para tu desarrollo)
spring.jpa.hibernate.ddl-auto=update

# ==========================================
# OPTIMIZACIÓN PARA SERVERLESS (HIKARI)
# ==========================================
spring.datasource.hikari.max-lifetime=300000
spring.datasource.hikari.keepalive-time=45000
spring.datasource.hikari.connection-timeout=30000

# ==========================================
# SEGURIDAD JWT (OPCIONAL PERO RECOMENDADO)
# ==========================================
# Si tienes una llave secreta para los tokens, también pásala aquí
# jwt.secret=${JWT_SECRET}